<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar exclusao</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container confirmacao-container">
    <section class="confirmacao">
        <p class="sobretitulo">Excluir receita</p>
        <h1>Deseja excluir esta receita?</h1>
        <p>Esta acao removera <strong th:text="${receita.nome}">a receita</strong> da sua lista.</p>
        <div class="rodape-formulario">
            <a class="botao botao-secundario" th:href="@{/receitas}">Cancelar</a>
            <form th:action="@{/receitas/excluir/{id}(id=${receita.id})}" method="post">
                <button class="botao botao-perigo" type="submit">Sim excluir receita</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
